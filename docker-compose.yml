version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: netshield-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - netshield-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netshield-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./logging:/app/logging
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - netshield-network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netshield-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./logging:/app/logging
    depends_on:
      - backend
      - redis
    restart: unless-stopped
    networks:
      - netshield-network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netshield-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - netshield-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netshield-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - netshield-network

  db:
    image: postgres:16-alpine
    container_name: netshield-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netshield_secret}
      POSTGRES_DB: ${POSTGRES_DB:-netshield_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netshield}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - netshield-network

  mongodb:
    image: mongo:7
    container_name: netshield-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-netshield}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-netshield_mongo}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-netshield_traffic}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    restart: unless-stopped
    networks:
      - netshield-network

  redis:
    image: redis:7-alpine
    container_name: netshield-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - netshield-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: netshield-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@netshield.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - netshield-network

  mongo-express:
    image: mongo-express:latest
    container_name: netshield-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-netshield}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-netshield_mongo}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-admin}
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - netshield-network

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  pgadmin_data:

networks:
  netshield-network:
    driver: bridge
