version: '3.8'

services:
  # PostgreSQL Database for User Management & RBAC
  postgres_db:
    image: postgres:15-alpine
    container_name: netshield_postgres
    restart: always
    environment:
      POSTGRES_USER: netshield_admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: netshield_users
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MongoDB for Traffic Data & AI Analytics Storage
  mongo_db:
    image: mongo:6.0
    container_name: netshield_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres_db
      - mongo_db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL:process.env.NEXT_PUBLIC_API_URL || http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
