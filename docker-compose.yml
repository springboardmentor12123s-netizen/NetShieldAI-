services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netshield-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netshield-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped