version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: netshield-db
    environment:
      POSTGRES_USER: netshield
      POSTGRES_PASSWORD: netshield
      POSTGRES_DB: netshield
    volumes:
      - netshield_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netshield"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: netshield-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://netshield:netshield@db:5432/netshield
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: netshield-frontend
    ports:
      - "5500:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  netshield_pg_data:
