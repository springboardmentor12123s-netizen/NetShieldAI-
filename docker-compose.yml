version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netshield
      POSTGRES_PASSWORD: netshield
      POSTGRES_DB: netshield
    ports: ["15432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
  backend:
    build: ./backend
    ports: ["8000:8000"]
    depends_on:
      - postgres
      - mongo
    environment:
      - DATABASE_URL=postgresql+asyncpg://netshield:netshield@postgres:5432/netshield
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=netshield
      - SECRET_KEY=super-secret-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:35173,http://127.0.0.1:35173,http://localhost:8173,http://127.0.0.1:8173
  frontend:
    build: ./frontend
    ports: ["8173:5173"]
    depends_on:
      - backend
    environment:
      - VITE_API_URL=/api/v1
      - BACKEND_URL=http://backend:8000
volumes:
  pgdata:
  mongodata:
